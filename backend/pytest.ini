[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    genre: Tests for genre operations
    movie: Tests for movie CRUD operations
    review: Tests for review operations
    discovery: Tests for movie discovery features
    filtering: Tests for movie filtering features
    slow: Tests that take longer to run
    integration: Integration tests

# Coverage options (if using pytest-cov)
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False