<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CineBook – My Bookings</title>
  <link rel="stylesheet" href="css/bookings.css" />
</head>
<body>
  <div class="page-container">
    <header class="top-nav">
      <div class="brand">CineBook</div>
      <nav class="nav-links">
        <a href="screenings.html">Screenings</a>
        <a href="movies.html">Movies</a>
        <a href="theatres.html">Theatres</a>
      </nav>
      <div class="nav-profile">
        <div class="avatar-circle">S</div>
      </div>
    </header>

    <section class="profile-card">
      <div class="profile-avatar">
        <div class="avatar-circle avatar-large">S</div>
      </div>
      <div class="profile-details">
        <p class="profile-label">Name</p>
        <p class="profile-value" id="userName">Cinema Freak</p>

        <p class="profile-label">Phone</p>
        <p class="profile-value" id="userPhone">017450678</p>
      </div>
    </section>

    <section class="history-section">
      <h2>Booking History</h2>

      <h3>Upcoming</h3>
      <div id="upcomingContainer" class="table-wrapper">
        <table class="booking-table">
          <thead>
            <tr>
              <th>Movie</th>
              <th>Date</th>
              <th>Time</th>
              <th>Seat</th>
              <th>Theatre</th>
              <th>Hall</th>
              <th>Payment</th>
            </tr>
          </thead>
          <tbody id="upcomingBody">
          </tbody>
        </table>
        <p id="upcomingEmpty" class="empty-text hidden">
          No upcoming bookings.
        </p>
      </div>

      <h3>Past History</h3>
      <div id="pastContainer" class="table-wrapper">
        <table class="booking-table">
          <thead>
            <tr>
              <th>Movie</th>
              <th>Date</th>
              <th>Time</th>
              <th>Seat</th>
              <th>Theatre</th>
              <th>Hall</th>
              <th>Payment</th>
            </tr>
          </thead>
          <tbody id="pastBody">
          </tbody>
        </table>
        <p id="pastEmpty" class="empty-text hidden">
          No past bookings yet.
        </p>
      </div>
    </section>

    <p id="statusMsg" class="status-msg"></p>
  </div>

  <script src="js/core-api.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
