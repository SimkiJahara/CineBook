<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Past Screenings</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7f7f7;
}

/* HEADER */
.top-header {
    background: #222;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    align-items: center;
}

.left-title {
    font-size: 24px;
    font-weight: bold;
}

.page-title {
    font-size: 20px;
    opacity: 0.85;
}

.right-icons {
    display: flex;
    align-items: center;
    gap: 15px;
}

.icon-link {
    color: white;
    text-decoration: none;
}

.logout-btn {
    background: #e74c3c;
    border: none;
    padding: 7px 12px;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}

/* CONTAINER LAYOUT */
.container {
    display: flex;
    padding: 20px;
    gap: 20px;
}

/* FILTERS (LEFT) */
.filters {
    width: 250px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    height: fit-content;
    position: sticky;
    top: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.filters label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

.filters input[type="text"],
.filters input[type="date"] {
    width: 100%;
    padding: 7px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.checkbox-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 5px 0;
}

.filter-btn {
    margin-top: 20px;
    width: 100%;
    padding: 8px;
    border: none;
    background: #3498db;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}

/* SCREENINGS SECTION (RIGHT) */
.screenings {
    flex-grow: 1;
}

/* DATE + HALL INDENTATION */
.date-heading {
    margin: 10px 0 0 0;
}
.date-divider {
    border: none;
    border-top: 2px solid #ccc;
    margin: 5px 0 15px 0;
}

.hall-section {
    margin-left: 25px;
}

.hall-heading {
    margin-bottom: 0;
}
.hall-divider {
    border: none;
    border-top: 1.5px solid #ddd;
    margin: 5px 0 15px 0;
}

.movie-card {
    background: white;
    margin-left: 40px;
    margin-bottom: 25px;
    padding: 18px;
    width: 520px;        /* Slimmer box */
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* CARD ROWS */
.card-row {
    margin-bottom: 14px;
}

/* TOP ROW LAYOUT */
.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.date-time {
    text-align: left;
}

.hall-number {
    font-weight: bold;
}

.action-btn-large button {
    padding: 8px 12px;
    background: #34495e;
    border: none;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}

/* MOVIE TITLE */
.movie-title-row {
    margin-top: 10px;
}

.movie-title {
    font-size: 17px;
    display: inline-block;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* SEATS SCROLL */
.seats-scroll {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 8px;
}

.seat-card {
    min-width: 120px;
    background: #eee;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
}

/* REVENUE ROW */
.revenue-row {
    font-size: 15px;
    margin-top: 15px;
}

.revenue-amount {
    margin-left: 10px;
    font-weight: bold;
    color: #27ae60;
}

</style>
</head>

<body>

<header class="top-header">
    <div class="left-title">CineBook</div>
    <div class="page-title">Your Past Screenings</div>
    <div class="right-icons">
        <a href="#" class="icon-link">👤 Dashboard</a>
        <button class="logout-btn">Logout</button>
    </div>
</header>

<div class="container">

    <!-- LEFT FILTERS (STICKY) -->
    <aside class="filters">

        <h3>Filters</h3>

        <label for="filter-date">Date</label>
        <input type="date" id="filter-date">

        <label>Hall Number</label>
        <div class="checkbox-group">
            <label><input type="checkbox"> Hall 1</label>
            <label><input type="checkbox"> Hall 2</label>
            <label><input type="checkbox"> Hall 3</label>
        </div>

        <label for="movie-search">Movies</label>
        <input type="text" id="movie-search" placeholder="Search movie...">

        <button class="filter-btn">Apply Filter</button>

    </aside>

    <!-- RIGHT CONTENT -->
    <main class="screenings">

        <!-- DATE SECTION -->
        <div class="date-section">
            <h2 class="date-heading">January 18, 2025</h2>
            <hr class="date-divider">

            <!-- HALL SECTION -->
            <div class="hall-section">
                <h3 class="hall-heading">Hall 1</h3>
                <hr class="hall-divider">

                <!-- MOVIE CARD -->
                <div class="movie-card">
                    <div class="card-row top-row">
                        <div class="date-time">
                            <div class="date">Jan 18</div>
                            <div class="time">7:30 PM</div>
                        </div>

                        <div class="hall-number">Hall 1</div>

                        <div class="action-btn-large">
                            <button class="view-btn">View layout of seats sold</button>
                        </div>
                    </div>

                    <div class="card-row movie-title-row">
                        <span class="movie-title" title="Example Movie With a Very Long Title That Must Be Truncated">
                            Example Movie With a Very Long Title That Must Be Truncated
                        </span>
                    </div>

                    <div class="card-row seats-scroll">
                        <div class="seat-card">
                            <div>Premium</div>
                            <div>$12</div>
                            <div>58 sold</div>
                        </div>

                        <div class="seat-card">
                            <div>Regular</div>
                            <div>$8</div>
                            <div>102 sold</div>
                        </div>

                        <div class="seat-card">
                            <div>VIP</div>
                            <div>$18</div>
                            <div>22 sold</div>
                        </div>
                    </div>

                    <div class="card-row revenue-row">
                        <strong>Total generated revenue:</strong>
                        <span class="revenue-amount">$3,840</span>
                    </div>

                </div><!-- END CARD -->

            </div><!-- END HALL SECTION -->
        </div><!-- END DATE SECTION -->

    </main>

</div>

</body>
</html>
