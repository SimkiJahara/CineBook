{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <h3>✓ Screening Deleted Successfully</h3>
    <p class="small-muted">The screening has been permanently removed from the system.</p>
    
    <div style="margin:16px 0;padding:12px;background:#f8f9fa;border-radius:6px">
      <div><strong>Deleted Screening ID:</strong> {{ screening_id }}</div>
      <div class="small-muted" style="margin-top:8px">This screening is no longer available.</div>
    </div>

    <div style="margin-top:16px">
      <a class="btn btn-primary" href="/unpublished-screenings/{{ owner_id }}">View Unpublished Screenings</a>
      <a class="btn" href="/schedule-screening/{{ owner_id }}" style="margin-left:8px">Schedule New Screening</a>
      <a class="btn" href="/dashboard/{{ owner_id }}" style="margin-left:8px">Dashboard</a>
    </div>
  </div>
{% endblock %}
