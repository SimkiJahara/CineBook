{% extends 'base.html' %}
{% block content %}
  <div class="col-main">
    <div class="card">
      <h2>Theater Owner Dashboard</h2>
      <p class="small-muted">Welcome back, {{ owner.ownername }} ({{ owner.businessname }})</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
        <a class="btn btn-primary" href="/schedule-screening/{{ owner_id }}">Schedule a Screening</a>
        <a class="btn" href="/unpublished-screenings/{{ owner_id }}">View Unpublished Screenings</a>
        <a class="btn" href="/published-screenings/{{ owner_id }}">View Published Screenings</a>
        <a class="btn" href="/past-screenings/{{ owner_id }}">View Past Screenings</a>
      </div>
    </div>
  </div>
{% endblock %}
